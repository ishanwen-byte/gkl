[workspace]
resolver = "2"
members = [
    "crates/gkl-git",
    "crates/gkl-db",
    "crates/gkl-core",
    "crates/gkl-agent",
    "crates/gkl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gix = { version = "0.58.0", default-features = false, features = ["comfort", "revparse-regex", "revision"] }
redb = "4.3.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
blake3 = "1"
jiff = { version = "0.2", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true
